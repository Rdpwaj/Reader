name: Build & Release Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Restore Persistent Signing Key (debug.keystore)
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -di debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkey -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/ChapterReader-v1.1.apk

      - name: Upload APK to Actions Artifacts (ZIP)
        uses: actions/upload-artifact@v4
        with:
          name: ChapterReader-v1.1-APK-Zip
          path: app/build/outputs/apk/debug/ChapterReader-v1.1.apk

      - name: Publish Direct APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.${{ github.run_number }}
          name: "قارئ الفصول v1.1 (بناء #${{ github.run_number }}) - ملف APK مباشر"
          body: |
            ### تحميل تطبيق «قارئ الفصول» للأندرويد (v1.1) 📖⚡
            - **هام لتجنب خطأ الحزمة:** حمّل ملف **`ChapterReader-v1.1.apk`** من قسم **Assets** بالأسفل مباشرة (وليس من Artifacts لأن Artifacts يكون مضغوطًا بصيغة ZIP).
            - **إذا ظهرت رسالة «الحزمة تتعارض مع حزمة حالية» عند التحديث فوق النسخة الأولى:** فهذا لأن النسخة الأولى وُقّعت بمفتاح مختلف. افتح النسخة الحالية في هاتفك ⬅️ **الإعدادات** ⬅️ **حفظ نسخة JSON** ⬅️ احذف النسخة القديمة وثبّت النسخة الجديدة ثم اضغط **استعادة نسخة** (وستعود كل فصولك ومواضع قراءتك 100%). ومن بعد هذا الإصدار ستتثبت كل التحديثات القادمة مباشرة دون حذف.
          files: app/build/outputs/apk/debug/ChapterReader-v1.1.apk
          prerelease: false
          make_latest: true
