name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Find project folder
        run: |
          FILE=$(find . -maxdepth 3 -name package.json -not -path '*/node_modules/*' | awk '{print length, $0}' | sort -n | head -n 1 | cut -d' ' -f2-)
          if [ -z "$FILE" ]; then
            echo "No package.json found. Files in repo:"
            ls -la
            exit 1
          fi
          DIR=$(dirname "$FILE")
          echo "Project folder: $DIR"
          echo "APP_DIR=$DIR" >> "$GITHUB_ENV"

      - name: Build web app
        working-directory: ${{ env.APP_DIR }}
        run: |
          npm install --legacy-peer-deps
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
          npm run build
          if [ -d dist ]; then WEB=dist; else WEB=build; fi
          echo "WEB_DIR=$WEB" >> "$GITHUB_ENV"

      - name: Make Android project
        working-directory: ${{ env.APP_DIR }}
        run: |
          if [ ! -f capacitor.config.ts ] && [ ! -f capacitor.config.json ]; then
            npx cap init "ChapterReader" com.chapterreader.app --web-dir "$WEB_DIR"
          fi
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build APK
        working-directory: ${{ env.APP_DIR }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: ${{ env.APP_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
