name: Build & Release Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Restore Persistent Signing Key (debug.keystore)
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkey -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/ChapterReader-v1.1-debug.apk

      - name: Upload APK to Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ChapterReader-APK
          path: app/build/outputs/apk/debug/ChapterReader-v1.1-debug.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: "قارئ الفصول v1.1 - تحديث سريع وسلس (بدون فقدان البيانات)"
          body: |
            ### تحميل تحديث تطبيق «قارئ الفصول» للأندرويد (v1.1) 📖⚡
            - **تحديث آمن:** يمكنك تثبيت هذا التحديث فوق النسخة السابقة مباشرة دون حذف أي بيانات أو فصول مخزنة لديك.
            - **أداء فائق وخفيف جدًا على الرام (RAM):** فتح فوري للتطبيق وتنقل فائق السلاسة 120fps.
            - **قوائم إعدادات منظمة + إصلاح تداخل أزرار النظام في شاشة القراءة.**
            
            اضغط على ملف **`ChapterReader-v1.1-debug.apk`** بالأسفل تحت قسم **Assets** لتنزيله وتثبيته مباشرة.
          files: app/build/outputs/apk/debug/ChapterReader-v1.1-debug.apk
          prerelease: false
          make_latest: true
