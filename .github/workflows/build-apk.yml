name: Build & Release Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate debug.keystore if missing
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/ChapterReader-v1.0-debug.apk

      - name: Upload APK to Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ChapterReader-APK
          path: app/build/outputs/apk/debug/ChapterReader-v1.0-debug.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: "قارئ الفصول - أحدث نسخة APK جاهزة للتثبيت"
          body: |
            ### تحميل مباشر لتطبيق «قارئ الفصول» للأندرويد 📖
            اضغط على ملف **`ChapterReader-v1.0-debug.apk`** بالأسفل تحت قسم **Assets** لتنزيله وتثبيته مباشرة على هاتفك الأندرويد بدون فك ضغط.
          files: app/build/outputs/apk/debug/ChapterReader-v1.0-debug.apk
          prerelease: false
          make_latest: true
